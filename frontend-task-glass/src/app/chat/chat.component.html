<div class="chat-page">
  <div class="chat-card glass-panel">
    <!-- Chat Header -->
    <div class="chat-header">
      <div class="header-title-box">
        <div class="bot-status-avatar">
          <i class="fa-solid fa-headset"></i>
          <span class="online-indicator"></span>
        </div>
        <div>
          <h2>AI Task Intelligence Assistant</h2>
          <p class="subtitle">Multimodal Vision, Voice Reasoning & SLA/Cost Advisor</p>
        </div>
      </div>
      
      <div class="header-actions flex items-center gap-2">
        <button class="voice-toggle-btn" [class.active]="isTtsEnabled" (click)="isTtsEnabled = !isTtsEnabled" title="Toggle Auto Read-Aloud (TTS)">
          <i class="fa-solid" [class.fa-volume-high]="isTtsEnabled" [class.fa-volume-xmark]="!isTtsEnabled"></i>
        </button>
        <button class="clear-btn" (click)="clearChat()" *ngIf="messages.length > 0">
          <i class="fa-solid fa-rotate-right"></i> Reset Session
        </button>
      </div>
    </div>

    <!-- Active Speech Banner -->
    <div class="speech-active-banner" *ngIf="isPlayingSpeech">
      <div class="speech-info">
        <span class="speaking-wave"><i class="fa-solid fa-waveform fa-bounce"></i></span>
        <span>Speaking Response Aloud...</span>
      </div>
      <button class="stop-speech-btn" (click)="stopSpeech()"><i class="fa-solid fa-circle-stop"></i> Stop</button>
    </div>

    <!-- Error Banner -->
    <div class="error-banner" *ngIf="error">
      <i class="fa-solid fa-circle-exclamation"></i>
      <span>{{ error }}</span>
    </div>

    <!-- Messages Container -->
    <div class="messages-container">
      <div *ngFor="let message of messages" 
           class="message-bubble-wrapper" 
           [class.user-wrapper]="message.role === 'user'"
           [class.assistant-wrapper]="message.role === 'assistant'">
        
        <div class="avatar-badge">
          <i class="fa-solid" [class.fa-user]="message.role === 'user'" [class.fa-robot]="message.role === 'assistant'"></i>
        </div>
        
        <div class="bubble-content">
          <div class="bubble-meta">
            <span class="role-name">{{ message.role === 'user' ? 'You' : 'AI Assistant' }}</span>
            <span class="time-stamp">{{ message.timestamp | date:'shortTime' }}</span>
            <button *ngIf="message.role === 'assistant'" class="speaker-bubble-btn" (click)="speak(message.content)" title="Speak message aloud">
              <i class="fa-solid fa-volume-high"></i>
            </button>
          </div>

          <!-- Attached Image Preview inside Message -->
          <div *ngIf="message.image" class="chat-attached-image-wrapper">
            <img [src]="message.image" alt="Attached document" class="chat-attached-image" />
          </div>

          <div class="bubble-text">{{ message.content }}</div>
        </div>
      </div>

      <!-- Typing Indicator -->
      <div *ngIf="loading" class="message-bubble-wrapper assistant-wrapper">
        <div class="avatar-badge">
          <i class="fa-solid fa-robot"></i>
        </div>
        <div class="bubble-content">
          <div class="typing-dots">
            <span></span>
            <span></span>
            <span></span>
          </div>
        </div>
      </div>
    </div>

    <!-- Input Section -->
    <div class="input-section">
      <!-- Attached Image Thumbnail Preview Bar -->
      <div *ngIf="attachedImageBase64" class="attached-preview-bar glass-panel-sm">
        <div class="preview-thumb">
          <img [src]="attachedImageBase64" alt="Attached file" />
        </div>
        <span class="preview-name"><i class="fa-solid fa-file-image text-cyan"></i> {{ attachedImageName }}</span>
        <button class="remove-attachment-btn" (click)="clearImageAttachment()" title="Remove attachment">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <div class="input-glass-box">
        <!-- File Picker Input (Hidden) -->
        <input 
          type="file" 
          id="chatImageInput" 
          (change)="onImageSelected($event)" 
          accept="image/*" 
          style="display: none;" />

        <div class="input-toolbar-left">
          <label for="chatImageInput" class="tool-btn" title="Attach image / architecture diagram">
            <i class="fa-solid fa-paperclip"></i>
          </label>

          <button 
            class="tool-btn mic-btn" 
            [class.listening]="isListening" 
            (click)="toggleListening()" 
            title="Voice STT Input">
            <i class="fa-solid" [class.fa-microphone]="!isListening" [class.fa-microphone-lines]="isListening" [class.fa-pulse]="isListening"></i>
          </button>
        </div>

        <textarea 
          [(ngModel)]="userMessage"
          (keypress)="onKeyPress($event)"
          placeholder="Ask about resources, cost models, or attach an architecture diagram image..."
          rows="2"
          class="chat-input"
          [disabled]="loading || !sessionId"></textarea>
        
        <button 
          class="send-btn"
          (click)="sendMessage()"
          [disabled]="(!userMessage.trim() && !attachedImageBase64) || loading || !sessionId">
          <i class="fa-solid" [class.fa-spinner]="loading" [class.fa-spin]="loading" [class.fa-paper-plane]="!loading"></i>
          <span>Send</span>
        </button>
      </div>

      <!-- Quick Chips -->
      <div class="quick-questions">
        <span class="quick-title"><i class="fa-solid fa-bolt text-cyan"></i> Prompts:</span>
        <div class="chips-flex">
          <button class="quick-chip" (click)="userMessage = 'Why was this resource recommended?'; sendMessage()">
            Why this resource?
          </button>
          <button class="quick-chip" (click)="userMessage = 'What are the alternative options?'; sendMessage()">
            Show alternatives
          </button>
          <button class="quick-chip" (click)="userMessage = 'What are the risks?'; sendMessage()">
            Risk assessment
          </button>
          <button class="quick-chip" (click)="userMessage = 'How can we optimize costs?'; sendMessage()">
            Cost optimization
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
